name: Build APK

on:
  push:
    branches:
      - master
      - 'claude/**'
    paths:
      - 'android_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Gradle ────────────────────────────────────────────────────────────
      - name: Download Gradle 8.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip \
               -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.6/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      # ── Android SDK ───────────────────────────────────────────────────────
      - name: Accept SDK licenses & install SDK 33
        run: |
          echo "ANDROID_HOME = $ANDROID_HOME"
          # Find sdkmanager regardless of cmdline-tools subdirectory name
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
                         -name "sdkmanager" -type f 2>/dev/null | head -1)
          echo "sdkmanager = $SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"; exit 1
          fi
          yes | "$SDKMANAGER" --licenses 2>/dev/null || true
          # SDK 33 is pre-installed on ubuntu-latest; install only if missing
          "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2" \
                        2>/dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > android_app/local.properties
          cat android_app/local.properties

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: android_app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DBTracker-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: APK size
        if: success()
        run: du -sh android_app/app/build/outputs/apk/debug/app-debug.apk
