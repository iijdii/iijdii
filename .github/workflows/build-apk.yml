name: Build APK

on:
  push:
    branches:
      - master
      - 'claude/**'
    paths:
      - 'android_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.6
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.6/bin" >> $GITHUB_PATH

      - name: Setup Android SDK
        run: |
          # Locate sdkmanager regardless of cmdline-tools version directory
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" \
            -type f 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses 2>/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Create local.properties
        working-directory: android_app
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        working-directory: android_app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DBTracker-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Show APK size
        if: success()
        run: du -sh android_app/app/build/outputs/apk/debug/app-debug.apk
