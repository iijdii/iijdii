<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Glaszuschnittplan</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; background: #eef1f5; }
  .app { display: flex; min-height: 100vh; }
  .panel { width: 340px; flex: 0 0 340px; background: #1f2937; color: #e5e7eb; padding: 18px; overflow-y: auto; }
  .panel h1 { font-size: 18px; margin: 0 0 4px; }
  .panel p.sub { font-size: 11px; color: #9ca3af; margin: 0 0 16px; line-height: 1.5; }
  .panel label { display: block; font-size: 12px; margin: 12px 0 4px; color: #cbd5e1; }
  .panel input, .panel textarea { width: 100%; padding: 6px 8px; border: 1px solid #374151; border-radius: 4px;
    background: #111827; color: #e5e7eb; font-family: monospace; font-size: 13px; }
  .panel textarea { min-height: 86px; resize: vertical; }
  .hint { font-size: 10px; color: #6b7280; margin-top: 2px; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btns button { flex: 1; padding: 9px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
  #calc { background: #2b6cb0; color: #fff; }
  #print { background: #374151; color: #e5e7eb; }
  #dl { background: #1f7a3d; color: #fff; }
  .err { color: #fca5a5; font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
  .view { flex: 1; overflow-y: auto; background: #f3f4f6; }
  .view iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  @media print { .panel { display: none; } .app { display: block; } .view iframe { height: auto; } }
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <h1>Glaszuschnittplan</h1>
    <p class="sub">Koordinaten-Editor · alle Maße in mm<br/>Maße eingeben → „Berechnen".</p>

    <label>Höhe H (mm)</label>
    <input id="H" value="2170"/>

    <label>Unterkante — Maße (eine Zahl pro Zeile)</label>
    <textarea id="bottom">1370
1280
1080
1070</textarea>
    <div class="hint">Breiten der Felder entlang der Unterkante.</div>

    <label>Oberkante — Maße (eine Zahl pro Zeile)</label>
    <textarea id="top">55
55
215
50</textarea>
    <div class="hint">Gleiche Anzahl Zeilen wie Unterkante.</div>

    <label>Kontrollmaße (optional, JSON-Array)</label>
    <textarea id="controls">[
  { "diagAC": 2540, "left": 2170 },
  null,
  { "left": 3300 },
  null
]</textarea>
    <div class="hint">Schlüssel: bottom, top, left, right, diagAC, diagBD. Δ &gt; Toleranz ⇒ Nachmessen.</div>

    <label>Toleranz (mm) · Faktor lange Seite</label>
    <div style="display:flex;gap:8px;">
      <input id="tol" value="30"/>
      <input id="factor" value="1.3"/>
    </div>

    <div class="btns">
      <button id="calc">Berechnen</button>
      <button id="print">Drucken</button>
      <button id="dl">HTML</button>
    </div>
    <div id="err" class="err"></div>
  </div>

  <div class="view"><iframe id="out"></iframe></div>
</div>

<script>
/* ===========================================================================
 * GLASZUSCHNITT-ENGINE  — Rechenkern (inline, ohne Abhängigkeiten)
 * ======================================================================== */
var GlassEngine = (function () {
  'use strict';
  var DEFAULTS = { measureTolerance: 30, longSideFactor: 1.3 };

  function dist(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }

  function polygonArea(pts) {
    var s = 0;
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i], q = pts[(i + 1) % pts.length];
      s += p.x * q.y - q.x * p.y;
    }
    return Math.abs(s) / 2;
  }

  function convexHull(points) {
    var pts = points.slice().sort(function (a, b) { return a.x === b.x ? a.y - b.y : a.x - b.x; });
    if (pts.length <= 2) return pts;
    var cross = function (o, a, b) { return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x); };
    var lower = [];
    for (var i = 0; i < pts.length; i++) {
      while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], pts[i]) <= 0) lower.pop();
      lower.push(pts[i]);
    }
    var upper = [];
    for (var j = pts.length - 1; j >= 0; j--) {
      while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], pts[j]) <= 0) upper.pop();
      upper.push(pts[j]);
    }
    lower.pop(); upper.pop();
    return lower.concat(upper);
  }

  function boundingBox(pts) {
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    pts.forEach(function (p) {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    });
    return {
      width: maxX - minX, height: maxY - minY, angle: 0, rotated: false,
      corners: [{ x: minX, y: minY }, { x: maxX, y: minY }, { x: maxX, y: maxY }, { x: minX, y: maxY }]
    };
  }

  function minBoundingRect(points) {
    var hull = convexHull(points);
    if (hull.length < 3) return boundingBox(points);
    var best = null;
    for (var i = 0; i < hull.length; i++) {
      var a = hull[i], b = hull[(i + 1) % hull.length];
      var dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
      var ux = dx / len, uy = dy / len, vx = -uy, vy = ux;
      var minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
      for (var k = 0; k < hull.length; k++) {
        var p = hull[k], pu = p.x * ux + p.y * uy, pv = p.x * vx + p.y * vy;
        if (pu < minU) minU = pu; if (pu > maxU) maxU = pu;
        if (pv < minV) minV = pv; if (pv > maxV) maxV = pv;
      }
      var w = maxU - minU, h = maxV - minV, area = w * h;
      if (!best || area < best.area - 1e-6) {
        var box = [{ u: minU, v: minV }, { u: maxU, v: minV }, { u: maxU, v: maxV }, { u: minU, v: maxV }]
          .map(function (c) { return { x: c.u * ux + c.v * vx, y: c.u * uy + c.v * vy }; });
        best = { area: area, width: w, height: h, angle: Math.atan2(uy, ux), rotated: true, corners: box };
      }
    }
    if (best.height > best.width) { var t = best.width; best.width = best.height; best.height = t; }
    return best;
  }

  function buildNodes(widths, y) {
    var nodes = [{ x: 0, y: y }], acc = 0;
    for (var i = 0; i < widths.length; i++) { acc += Number(widths[i]) || 0; nodes.push({ x: acc, y: y }); }
    return nodes;
  }

  function checkControls(glass, control, tol) {
    var checks = [];
    if (control) {
      var map = {
        bottom: glass.sides.bottom, top: glass.sides.top, left: glass.sides.left,
        right: glass.sides.right, diagAC: glass.diagonals.ac, diagBD: glass.diagonals.bd
      };
      Object.keys(map).forEach(function (key) {
        if (control[key] != null && control[key] !== '') {
          var measured = Number(control[key]), computed = map[key], dev = Math.abs(computed - measured);
          checks.push({ name: key, computed: computed, measured: measured, deviation: dev, ok: dev <= tol });
        }
      });
    }
    var failed = checks.filter(function (c) { return !c.ok; });
    return {
      checks: checks, ok: failed.length === 0,
      status: checks.length === 0 ? 'OHNE KONTROLLMASS' : (failed.length === 0 ? 'OK' : 'NACHMESSEN ERFORDERLICH')
    };
  }

  function computePlan(input) {
    var H = Number(input.H);
    var bottom = (input.bottom || []).map(Number);
    var top = (input.top || []).map(Number);
    var controls = input.controls || [];
    var opt = Object.assign({}, DEFAULTS, input.options || {});
    if (!(H > 0)) throw new Error('Höhe H muss > 0 sein.');
    if (bottom.length === 0) throw new Error('Unterkante (bottom) ist leer.');
    if (bottom.length !== top.length) throw new Error('bottom und top müssen gleich viele Felder haben.');

    var P = buildNodes(bottom, 0), Q = buildNodes(top, H), glasses = [], n = bottom.length;
    for (var i = 0; i < n; i++) {
      var A = P[i], B = P[i + 1], C = Q[i + 1], D = Q[i], quad = [A, B, C, D];
      var sides = { bottom: dist(A, B), right: dist(B, C), top: dist(C, D), left: dist(D, A) };
      var diagonals = { ac: dist(A, C), bd: dist(B, D) };
      var longSide = Math.max(sides.bottom, sides.top, sides.left, sides.right);
      var rotated = longSide > opt.longSideFactor * H;
      var blank = rotated ? minBoundingRect(quad) : boundingBox(quad);
      var glassArea = polygonArea(quad), blankArea = blank.width * blank.height;
      var waste = blankArea > 0 ? (blankArea - glassArea) / blankArea * 100 : 0;
      var glass = {
        index: i + 1, quad: quad, nodes: { A: A, B: B, C: C, D: D }, sides: sides,
        diagonals: diagonals, longSide: longSide, blankType: rotated ? 'MBR' : 'NORMAL', blank: blank,
        areas: { glass_mm2: glassArea, blank_mm2: blankArea, glass_m2: glassArea / 1e6, blank_m2: blankArea / 1e6 },
        wastePercent: waste
      };
      glass.control = checkControls(glass, controls[i], opt.measureTolerance);
      glasses.push(glass);
    }
    var totalGlass = glasses.reduce(function (s, g) { return s + g.areas.glass_m2; }, 0);
    var totalBlank = glasses.reduce(function (s, g) { return s + g.areas.blank_m2; }, 0);
    return {
      H: H, options: opt, nodes: { bottom: P, top: Q }, glasses: glasses,
      summary: {
        count: glasses.length, totalGlass_m2: totalGlass, totalBlank_m2: totalBlank,
        totalWastePercent: totalBlank > 0 ? (totalBlank - totalGlass) / totalBlank * 100 : 0,
        needsRemeasure: glasses.some(function (g) { return !g.control.ok; })
      }
    };
  }

  return { computePlan: computePlan };
})();

/* ===========================================================================
 * GLASZUSCHNITT-RENDER — SVG + druckfertiges HTML (inline)
 * ======================================================================== */
var GlassRender = (function () {
  'use strict';
  var STYLE = {
    blankStroke: '#888', glassFill: 'rgba(56,135,209,0.30)', glassStroke: '#2b6cb0',
    cutStroke: '#e8730c', dimColor: '#222', blankDimColor: '#666', wasteColor: '#b23b3b',
    font: 'Arial, Helvetica, sans-serif'
  };
  function round(v, d) { var f = Math.pow(10, d || 0); return Math.round(v * f) / f; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function mid(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

  function edgeLabel(a, b, centroid, text, color, fontSize) {
    var m = mid(a, b), nx = m.x - centroid.x, ny = m.y - centroid.y, nl = Math.hypot(nx, ny) || 1, off = fontSize * 1.4;
    var lx = m.x + (nx / nl) * off, ly = m.y + (ny / nl) * off;
    return '<text x="' + round(lx, 1) + '" y="' + round(ly, 1) + '" fill="' + color + '" font-size="' + fontSize +
      '" font-family="' + STYLE.font + '" text-anchor="middle" dominant-baseline="middle">' + esc(text) + '</text>';
  }

  function glassSVG(glass, opt) {
    opt = opt || {};
    var maxDraw = opt.maxDraw || 320, fontSize = opt.fontSize || 13;
    var pts = glass.quad.concat(glass.blank.corners);
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    pts.forEach(function (p) {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    });
    var worldW = (maxX - minX) || 1, worldH = (maxY - minY) || 1, scale = maxDraw / Math.max(worldW, worldH);
    var margin = fontSize * 6, W = worldW * scale + margin * 2, Hpx = worldH * scale + margin * 2;
    function tx(p) { return { x: margin + (p.x - minX) * scale, y: margin + (maxY - p.y) * scale }; }

    var g = glass.quad.map(tx), bl = glass.blank.corners.map(tx);
    var centroid = { x: (g[0].x + g[1].x + g[2].x + g[3].x) / 4, y: (g[0].y + g[1].y + g[2].y + g[3].y) / 4 };
    var parts = [];
    parts.push('<svg viewBox="0 0 ' + round(W, 1) + ' ' + round(Hpx, 1) + '" width="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" font-family="' + STYLE.font + '">');
    parts.push('<polygon points="' + bl.map(function (p) { return round(p.x, 1) + ',' + round(p.y, 1); }).join(' ') + '" fill="none" stroke="' + STYLE.blankStroke + '" stroke-width="1.2" stroke-dasharray="6 4"/>');
    parts.push('<polygon points="' + g.map(function (p) { return round(p.x, 1) + ',' + round(p.y, 1); }).join(' ') + '" fill="' + STYLE.glassFill + '" stroke="' + STYLE.glassStroke + '" stroke-width="1.2"/>');
    var quad = glass.quad;
    for (var e = 0; e < 4; e++) {
      var a = quad[e], b = quad[(e + 1) % 4], dx = Math.abs(b.x - a.x), dy = Math.abs(b.y - a.y);
      var isCut = !glass.blank.rotated ? (dx > 0.5 && dy > 0.5) : true;
      if (isCut) {
        var sa = tx(a), sb = tx(b);
        parts.push('<line x1="' + round(sa.x, 1) + '" y1="' + round(sa.y, 1) + '" x2="' + round(sb.x, 1) + '" y2="' + round(sb.y, 1) + '" stroke="' + STYLE.cutStroke + '" stroke-width="2.4"/>');
      }
    }
    var labels = ['A', 'B', 'C', 'D'];
    g.forEach(function (p, idx) {
      parts.push('<circle cx="' + round(p.x, 1) + '" cy="' + round(p.y, 1) + '" r="2.5" fill="' + STYLE.glassStroke + '"/>');
      var lx = p.x + (p.x - centroid.x) * 0.06, ly = p.y + (p.y - centroid.y) * 0.06;
      parts.push('<text x="' + round(lx, 1) + '" y="' + round(ly, 1) + '" font-size="' + (fontSize - 2) + '" fill="' + STYLE.glassStroke + '" text-anchor="middle">' + labels[idx] + '</text>');
    });
    parts.push(edgeLabel(g[0], g[1], centroid, round(glass.sides.bottom) + '', STYLE.dimColor, fontSize));
    parts.push(edgeLabel(g[1], g[2], centroid, round(glass.sides.right) + '', STYLE.dimColor, fontSize));
    parts.push(edgeLabel(g[2], g[3], centroid, round(glass.sides.top) + '', STYLE.dimColor, fontSize));
    parts.push(edgeLabel(g[3], g[0], centroid, round(glass.sides.left) + '', STYLE.dimColor, fontSize));
    var blC = { x: (bl[0].x + bl[1].x + bl[2].x + bl[3].x) / 4, y: (bl[0].y + bl[1].y + bl[2].y + bl[3].y) / 4 };
    parts.push(edgeLabel(bl[0], bl[1], blC, '▭ ' + round(glass.blank.width), STYLE.blankDimColor, fontSize - 1));
    parts.push(edgeLabel(bl[1], bl[2], blC, '▭ ' + round(glass.blank.height), STYLE.blankDimColor, fontSize - 1));
    parts.push('<text x="' + round(W / 2, 1) + '" y="' + round(Hpx - fontSize, 1) + '" fill="' + STYLE.wasteColor + '" font-size="' + fontSize + '" text-anchor="middle">Verschnitt: ' + round(glass.wastePercent, 1) + '%</text>');
    parts.push('</svg>');
    return parts.join('\n');
  }

  function glassCard(glass) {
    var c = glass.control;
    var statusClass = c.status === 'OK' ? 'ok' : (c.status === 'OHNE KONTROLLMASS' ? 'neutral' : 'warn');
    var rows = [
      ['Unterkante (AB)', round(glass.sides.bottom) + ' mm'],
      ['Oberkante (CD)', round(glass.sides.top) + ' mm'],
      ['Linke Seite (DA)', round(glass.sides.left) + ' mm'],
      ['Rechte Seite (BC)', round(glass.sides.right) + ' mm'],
      ['Diagonale A–C', round(glass.diagonals.ac) + ' mm'],
      ['Diagonale B–D', round(glass.diagonals.bd) + ' mm'],
      ['Zuschnitt (Platte)', round(glass.blank.width) + ' × ' + round(glass.blank.height) + ' mm' + (glass.blank.rotated ? ' (gedreht ' + round(glass.blank.angle * 180 / Math.PI, 1) + '°)' : '')],
      ['Glasfläche', round(glass.areas.glass_m2, 3) + ' m²'],
      ['Plattenfläche', round(glass.areas.blank_m2, 3) + ' m²'],
      ['Verschnitt', round(glass.wastePercent, 1) + ' %']
    ];
    var rowsHtml = rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join('');
    var ctrlHtml = '';
    if (c.checks.length) {
      ctrlHtml = '<div class="ctrl"><b>Kontrollmaße:</b><ul>' + c.checks.map(function (ch) {
        return '<li class="' + (ch.ok ? 'ok' : 'warn') + '">' + esc(ch.name) + ': Soll ' + round(ch.computed) + ' / Mess ' + round(ch.measured) + ' (Δ ' + round(ch.deviation) + ' mm)' + (ch.ok ? '' : ' ⚠') + '</li>';
      }).join('') + '</ul></div>';
    }
    return '<div class="glass-card"><div class="glass-head"><h3>Glas ' + glass.index +
      ' <span class="badge ' + (glass.blankType === 'MBR' ? 'mbr' : '') + '">' +
      (glass.blankType === 'MBR' ? 'gedrehter Zuschnitt (MBR)' : 'Standard-Zuschnitt') + '</span>' +
      '<span class="status ' + statusClass + '">' + esc(glass.control.status) + '</span></h3></div>' +
      '<div class="glass-body"><div class="glass-svg">' + glassSVG(glass) + '</div>' +
      '<div class="glass-data"><table>' + rowsHtml + '</table>' + ctrlHtml + '</div></div></div>';
  }

  function summaryTable(plan) {
    var head = '<tr><th>Nr.</th><th>Zuschnitt (mm)</th><th>Glasmaß U/O/L/R</th><th>Glasfläche</th><th>Plattenfläche</th><th>Verschnitt</th><th>Prüfung</th></tr>';
    var body = plan.glasses.map(function (g) {
      var sc = g.control.status === 'OK' ? 'ok' : (g.control.status === 'OHNE KONTROLLMASS' ? 'neutral' : 'warn');
      return '<tr><td>' + g.index + '</td><td>' + round(g.blank.width) + ' × ' + round(g.blank.height) + (g.blank.rotated ? ' ↻' : '') + '</td>' +
        '<td>' + round(g.sides.bottom) + ' / ' + round(g.sides.top) + ' / ' + round(g.sides.left) + ' / ' + round(g.sides.right) + '</td>' +
        '<td>' + round(g.areas.glass_m2, 3) + ' m²</td><td>' + round(g.areas.blank_m2, 3) + ' m²</td>' +
        '<td>' + round(g.wastePercent, 1) + ' %</td><td class="status ' + sc + '">' + esc(g.control.status) + '</td></tr>';
    }).join('');
    var foot = '<tr class="total"><td colspan="3">Summe</td><td>' + round(plan.summary.totalGlass_m2, 3) + ' m²</td>' +
      '<td>' + round(plan.summary.totalBlank_m2, 3) + ' m²</td><td>' + round(plan.summary.totalWastePercent, 1) + ' %</td>' +
      '<td>' + (plan.summary.needsRemeasure ? 'NACHMESSEN' : 'OK') + '</td></tr>';
    return '<table class="summary"><thead>' + head + '</thead><tbody>' + body + foot + '</tbody></table>';
  }

  var CSS = [
    '* { box-sizing: border-box; }',
    'body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; background: #f3f4f6; }',
    '.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding: 18px 24px; border-bottom: 3px solid #1a1a1a; background: #fff; }',
    'h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 0.5px; }',
    '.subtitle { margin: 0; color: #555; font-size: 12px; line-height: 1.5; }',
    '.meta { font-size: 12px; text-align: right; } .meta div { margin: 2px 0; } .meta span { color: #777; display: inline-block; min-width: 70px; text-align: left; }',
    '.legend { display: flex; gap: 18px; padding: 10px 24px; font-size: 12px; background: #fff; border-bottom: 1px solid #ddd; flex-wrap: wrap; }',
    '.legend .sw { display: inline-block; width: 16px; height: 12px; margin-right: 4px; vertical-align: middle; border: 1px solid #999; }',
    '.sw.blank { background: repeating-linear-gradient(90deg,#888 0 4px,transparent 4px 8px); border-color:#888; }',
    '.sw.glass { background: rgba(56,135,209,0.30); border-color: #2b6cb0; } .sw.cut { background: #e8730c; border-color: #e8730c; } .sw.warn { background: #f6c6c6; border-color: #b23b3b; }',
    '.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 16px 24px; }',
    '.glass-card { background: #fff; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; page-break-inside: avoid; break-inside: avoid; }',
    '.glass-head h3 { margin: 0; padding: 10px 12px; font-size: 15px; background: #1f2937; color: #fff; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }',
    '.badge { font-size: 10px; font-weight: normal; background: #374151; padding: 2px 6px; border-radius: 3px; } .badge.mbr { background: #8a4b0c; }',
    '.status { font-size: 10px; padding: 2px 6px; border-radius: 3px; margin-left: auto; } .status.ok { background: #1f7a3d; color: #fff; } .status.warn { background: #b23b3b; color: #fff; } .status.neutral { background: #6b7280; color: #fff; }',
    '.glass-body { display: flex; gap: 8px; padding: 10px; } .glass-svg { flex: 1 1 55%; min-width: 0; } .glass-svg svg { width: 100%; height: auto; }',
    '.glass-data { flex: 1 1 45%; font-size: 11px; } .glass-data table { width: 100%; border-collapse: collapse; }',
    '.glass-data td { padding: 2px 4px; border-bottom: 1px solid #eee; } .glass-data td:last-child { text-align: right; font-variant-numeric: tabular-nums; }',
    '.ctrl { margin-top: 6px; font-size: 10px; } .ctrl ul { margin: 4px 0 0; padding-left: 16px; } .ctrl li.warn { color: #b23b3b; font-weight: bold; } .ctrl li.ok { color: #1f7a3d; }',
    '.summary-wrap { padding: 8px 24px 24px; } h2 { font-size: 18px; }',
    'table.summary { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; }',
    'table.summary th, table.summary td { border: 1px solid #ccc; padding: 6px 8px; text-align: center; } table.summary th { background: #1f2937; color: #fff; }',
    'table.summary td.status.ok { background: #d6f0de; } table.summary td.status.warn { background: #f6d6d6; color: #b23b3b; font-weight: bold; } table.summary td.status.neutral { background: #eef0f2; }',
    'table.summary tr.total td { font-weight: bold; background: #eef2f7; }',
    '.sheet-foot { padding: 10px 24px; font-size: 11px; color: #777; text-align: center; border-top: 1px solid #ddd; }',
    '@page { size: A4; margin: 12mm; }',
    '@media print { body { background: #fff; } .cards { padding: 8px 0; gap: 10px; } .summary-wrap, .sheet-head, .legend { padding-left: 0; padding-right: 0; } }'
  ].join('\n');

  function buildHTML(plan, meta) {
    meta = meta || {};
    var dateStr = meta.date || new Date().toISOString().slice(0, 10);
    var cards = plan.glasses.map(glassCard).join('\n');
    return '<!DOCTYPE html>\n<html lang="de">\n<head>\n<meta charset="utf-8"/>\n<meta name="viewport" content="width=device-width, initial-scale=1"/>\n<title>Glaszuschnittplan</title>\n<style>\n' + CSS + '\n</style>\n</head>\n<body>\n' +
      '<header class="sheet-head"><div><h1>Glaszuschnittplan</h1><p class="subtitle">Alle Maße in mm<br/>Zeichnung nicht maßstabsgetreu<br/>Fertigung nach Maßangaben</p></div>\n<div class="meta">' +
      (meta.project ? '<div><span>Projekt:</span> ' + esc(meta.project) + '</div>' : '') +
      (meta.order ? '<div><span>Auftrag:</span> ' + esc(meta.order) + '</div>' : '') +
      '<div><span>Höhe H:</span> ' + round(plan.H) + ' mm</div><div><span>Gläser:</span> ' + plan.summary.count + '</div><div><span>Datum:</span> ' + esc(dateStr) + '</div></div></header>\n' +
      '<section class="legend"><span><i class="sw blank"></i> Zuschnitt-Platte</span><span><i class="sw glass"></i> Glas</span><span><i class="sw cut"></i> Schnitte</span><span><i class="sw warn"></i> Nachmessen nötig</span></section>\n' +
      '<section class="cards">\n' + cards + '\n</section>\n' +
      '<section class="summary-wrap"><h2>Schnittliste / Zusammenfassung</h2>\n' + summaryTable(plan) + '</section>\n' +
      '<footer class="sheet-foot">Glaszuschnittplan · Fertigung nach Maßangaben · Alle Maße in mm</footer>\n</body>\n</html>\n';
  }

  return { buildHTML: buildHTML };
})();

/* ===========================================================================
 * EDITOR-STEUERUNG
 * ======================================================================== */
var $ = function (id) { return document.getElementById(id); };

function parseNums(text) {
  return text.split(/[\n,;]+/).map(function (s) { return s.trim(); })
    .filter(function (s) { return s.length; }).map(Number);
}

function gatherInput() {
  var controls = [], ctext = $('controls').value.trim();
  if (ctext) { try { controls = JSON.parse(ctext); } catch (e) { throw new Error('Kontrollmaße: ungültiges JSON\n' + e.message); } }
  return {
    meta: { project: 'Glasschiebewand', date: new Date().toISOString().slice(0, 10) },
    H: Number($('H').value), bottom: parseNums($('bottom').value), top: parseNums($('top').value),
    controls: controls, options: { measureTolerance: Number($('tol').value), longSideFactor: Number($('factor').value) }
  };
}

var lastHTML = '';
function render() {
  $('err').textContent = '';
  try {
    var data = gatherInput();
    var plan = GlassEngine.computePlan(data);
    lastHTML = GlassRender.buildHTML(plan, data.meta);
    var doc = $('out').contentDocument;
    doc.open(); doc.write(lastHTML); doc.close();
  } catch (e) { $('err').textContent = e.message; }
}

$('calc').onclick = render;
$('print').onclick = function () { if ($('out').contentWindow) $('out').contentWindow.print(); };
$('dl').onclick = function () {
  if (!lastHTML) render();
  var blob = new Blob([lastHTML], { type: 'text/html' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'glaszuschnittplan.html'; a.click();
};
render();
</script>
</body>
</html>
