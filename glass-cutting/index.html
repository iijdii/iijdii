<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Glaszuschnittplan — Editor</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; background: #eef1f5; }
  .app { display: flex; min-height: 100vh; }
  .panel { width: 340px; flex: 0 0 340px; background: #1f2937; color: #e5e7eb; padding: 18px; overflow-y: auto; }
  .panel h1 { font-size: 18px; margin: 0 0 4px; }
  .panel p.sub { font-size: 11px; color: #9ca3af; margin: 0 0 16px; line-height: 1.5; }
  .panel label { display: block; font-size: 12px; margin: 12px 0 4px; color: #cbd5e1; }
  .panel input, .panel textarea { width: 100%; padding: 6px 8px; border: 1px solid #374151; border-radius: 4px;
    background: #111827; color: #e5e7eb; font-family: monospace; font-size: 13px; }
  .panel textarea { min-height: 86px; resize: vertical; }
  .hint { font-size: 10px; color: #6b7280; margin-top: 2px; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btns button { flex: 1; padding: 9px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
  #calc { background: #2b6cb0; color: #fff; }
  #print { background: #374151; color: #e5e7eb; }
  #dl { background: #1f7a3d; color: #fff; }
  .err { color: #fca5a5; font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
  .view { flex: 1; overflow-y: auto; background: #f3f4f6; }
  .view iframe { width: 100%; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <h1>Glaszuschnittplan</h1>
    <p class="sub">Koordinaten-Editor · alle Maße in mm<br/>Maße eingeben → „Berechnen".</p>

    <label>Höhe H (mm)</label>
    <input id="H" value="2170"/>

    <label>Unterkante — Maße (eine Zahl pro Zeile)</label>
    <textarea id="bottom">1370
1280
1080
1070</textarea>
    <div class="hint">Breiten der Felder entlang der Unterkante.</div>

    <label>Oberkante — Maße (eine Zahl pro Zeile)</label>
    <textarea id="top">55
55
215
50</textarea>
    <div class="hint">Gleiche Anzahl Zeilen wie Unterkante.</div>

    <label>Kontrollmaße (optional, JSON-Array)</label>
    <textarea id="controls">[
  { "diagAC": 2540, "left": 2170 },
  null,
  { "left": 3300 },
  null
]</textarea>
    <div class="hint">Schlüssel: bottom, top, left, right, diagAC, diagBD. Δ &gt; Toleranz ⇒ Nachmessen.</div>

    <label>Toleranz (mm) · Faktor lange Seite</label>
    <div style="display:flex;gap:8px;">
      <input id="tol" value="30"/>
      <input id="factor" value="1.3"/>
    </div>

    <div class="btns">
      <button id="calc">Berechnen</button>
      <button id="print">Drucken</button>
      <button id="dl">HTML</button>
    </div>
    <div id="err" class="err"></div>
  </div>

  <div class="view"><iframe id="out"></iframe></div>
</div>

<script src="glass-engine.js"></script>
<script src="glass-render.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };

  function parseNums(text) {
    return text.split(/[\n,;]+/).map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length; }).map(Number);
  }

  function gatherInput() {
    var controls = [];
    var ctext = $('controls').value.trim();
    if (ctext) {
      try { controls = JSON.parse(ctext); }
      catch (e) { throw new Error('Kontrollmaße: ungültiges JSON\n' + e.message); }
    }
    return {
      meta: { project: 'Glasschiebewand', date: new Date().toISOString().slice(0, 10) },
      H: Number($('H').value),
      bottom: parseNums($('bottom').value),
      top: parseNums($('top').value),
      controls: controls,
      options: {
        measureTolerance: Number($('tol').value),
        longSideFactor: Number($('factor').value)
      }
    };
  }

  var lastHTML = '';

  function render() {
    $('err').textContent = '';
    try {
      var data = gatherInput();
      var plan = GlassEngine.computePlan(data);
      lastHTML = GlassRender.buildHTML(plan, data.meta);
      var doc = $('out').contentDocument;
      doc.open(); doc.write(lastHTML); doc.close();
    } catch (e) {
      $('err').textContent = e.message;
    }
  }

  $('calc').onclick = render;
  $('print').onclick = function () {
    if ($('out').contentWindow) $('out').contentWindow.print();
  };
  $('dl').onclick = function () {
    if (!lastHTML) render();
    var blob = new Blob([lastHTML], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'glaszuschnittplan.html';
    a.click();
  };

  render();
</script>
</body>
</html>
